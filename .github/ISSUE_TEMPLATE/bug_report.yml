name: Report a bug
description: Report reproducible Logicytics v4 behavior without sharing private evidence.
title: "bug: "
labels: ["progress/Unreviewed"]
assignees: ["DefinetlyNotAI"]
body:
  - type: checkboxes
    attributes:
      label: Prerequisites
      options:
        - label: I searched existing issues and reproduced this on the latest supported v4 release.
          required: true
        - label: I read the contribution and security guidance and removed credentials, private evidence, and host identifiers.
          required: true
        - label: I ran `python -m logicytics preflight` and the relevant command again with a sanitized configuration.
          required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the actual result, expected result, and exact reproduction steps.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Logicytics version and commit
      placeholder: "4.0.0, commit abc1234"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Windows and Python versions
      placeholder: "Windows 11 24H2; Python 3.11.9"
    validations:
      required: true
  - type: dropdown
    id: action
    attributes:
      label: Affected action
      options:
        - preflight or plan
        - standard or balanced collection
        - quick or thorough collection
        - offline collection
        - extensions or non-Python MODs
        - performance collection
        - direct collector execution
        - debug, update, or developer action
        - usage or semantic matching
        - public Python API
        - package, hash, or artifact reading
        - other
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Sanitized command and configuration
      description: Include the command, profile/mode, approved capabilities, elevation state, and relevant non-secret settings.
      render: powershell
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics
      description: Paste only relevant redacted preflight, manifest status, collector failure, or debug details. Never attach collected evidence or secrets.
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Note whether optional WMIC, BitLocker, Sysinternals, PowerShell, or elevation capabilities were available.
    validations:
      required: false
