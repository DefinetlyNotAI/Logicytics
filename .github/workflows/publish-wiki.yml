name: Publish documentation wiki

on:
  push:
    branches: [ main ]
    paths:
      - "docs/**"
      - ".github/workflows/publish-wiki.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: documentation-wiki
  cancel-in-progress: true

jobs:
  publish:
    name: Publish docs to the repository wiki
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout wiki repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        continue-on-error: true
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Prepare wiki checkout
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ ! -d wiki/.git ]; then
            rm -rf wiki
            mkdir wiki
            git -C wiki init -b master
            git -C wiki remote add origin "https://x-access-token:${TOKEN}@github.com/${REPOSITORY}.wiki.git"
          fi

      - name: Replace wiki pages with docs
        shell: bash
        run: |
          set -euo pipefail
          find wiki -mindepth 1 ! -path 'wiki/.git' ! -path 'wiki/.git/*' -exec rm -rf {} +
          cp -R docs/. wiki/

      - name: Commit and push wiki pages
        shell: bash
        run: |
          set -euo pipefail
          git -C wiki config user.name "github-actions[bot]"
          git -C wiki config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C wiki add --all
          if git -C wiki diff --cached --quiet; then
            echo "Wiki is already current."
            exit 0
          fi
          git -C wiki commit -m "docs: publish repository documentation"
          git -C wiki push origin HEAD:master
